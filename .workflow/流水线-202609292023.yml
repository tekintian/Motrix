version: "1.0"
name: 构建、部署到自有主机
displayName: 构建、部署到自有主机
stages:
- name: 构建
  displayName: 构建
  strategy: naturally
  trigger: auto
  steps:
  - step: build@nodejs
    name: ""
    displayName: Nodejs 构建
    nodeVersion: 14.16.0
    commands:
    - '# 设置NPM源，提升安装速度'
    - npm config set registry https://registry.npmmirror.com
    - ""
    - '# 执行编译命令'
    - npm install && npm run build
    artifacts:
    - name: BUILD_ARTIFACT
      path:
      - ./dist
      type: .tar.gz
    caches:
    - "~/.npm"
    - "~/.yarn"
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
- name: 部署
  displayName: 部署
  strategy: naturally
  trigger: auto
  steps:
  - step: deploy@agent
    name: ""
    displayName: 主机部署
    deployArtifact:
    - name: output
      target: "~/gitee_go/deploy"
      source: build
      dependArtifact: BUILD_ARTIFACT
      artifactRepository: default
      artifactName: output
      artifactVersion: latest
    script: |-
      # 请在此输入部署脚本，如启动Java应用如下
      # nohup java -jar test.jar &gt; nohup.out &amp;
       echo 'Hello Gitee!'
    hostGroupID: {}
    notify: []
    strategy:
      retry: "0"
triggers:
  trigger: manual
notify: []
strategy:
  blocking: true
