image: ubuntu:22.04

variables:
  MOTRIX_SKIP_ELECTRON_REBUILD: '1'
  MOTRIX_SKIP_ENGINE_FETCH: '1'
  RUST_BACKTRACE: full

cache:
  paths:
    - node_modules/.cache/motrix-builtins/
    - .pnpm-store/
    - .cargo/registry/cache/
  key: motrix-ci-${CI_COMMIT_REF_NAME}

stages:

  - Setup-Env:
      - script:
          - |
            set -euo pipefail
            echo "==> apt base deps"
            apt-get update -qq
            apt-get install -y -qq curl ca-certificates build-essential python3 make g++ pkg-config git gnupg
            echo "==> Node 24"
            mkdir -p /etc/apt/keyrings
            curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
            echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_24.x nodistro main" > /etc/apt/sources.list.d/nodesource.list
            apt-get update -qq
            apt-get install -y -qq nodejs
            node -v
            echo "==> pnpm 12.5.1"
            corepack enable
            corepack prepare pnpm@12.5.1 --activate
            pnpm config set store-dir "$CI_PROJECT_DIR/.pnpm-store"
            pnpm -v
            echo "==> Rust 1.94.1 + musl target + rustfmt/clippy"
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.94.1 -c rustfmt clippy
            . "$HOME/.cargo/env"
            rustup target add x86_64-unknown-linux-musl
            rustc --version
            cargo --version

  - Rust-Quality:
      - script:
          - |
            set -euo pipefail
            . "$HOME/.cargo/env"
            cd "$CI_PROJECT_DIR"
            echo "==> cargo fmt (native-host)"
            cargo fmt --manifest-path packages/native-host/Cargo.toml --all -- --check
            echo "==> cargo fmt (finalize-fs)"
            cargo fmt --manifest-path packages/finalize-fs/Cargo.toml --all -- --check
          - |
            set -euo pipefail
            . "$HOME/.cargo/env"
            cd "$CI_PROJECT_DIR"
            echo "==> cargo clippy (native-host)"
            cargo clippy --manifest-path packages/native-host/Cargo.toml --all-targets --locked -- -D warnings
            echo "==> cargo clippy (finalize-fs)"
            cargo clippy --manifest-path packages/finalize-fs/Cargo.toml --all-targets --locked -- -D warnings
          - |
            set -euo pipefail
            . "$HOME/.cargo/env"
            cd "$CI_PROJECT_DIR"
            echo "==> cargo test native-host (x86_64-unknown-linux-musl)"
            cargo test --manifest-path packages/native-host/Cargo.toml --locked --all-targets --target x86_64-unknown-linux-musl
            echo "==> cargo test finalize-fs (x86_64-unknown-linux-musl)"
            cargo test --manifest-path packages/finalize-fs/Cargo.toml --locked --all-targets --target x86_64-unknown-linux-musl

  - JS-Install:
      - script:
          - |
            set -euo pipefail
            cd "$CI_PROJECT_DIR"
            echo "==> pnpm install --frozen-lockfile"
            pnpm install --frozen-lockfile
            echo "==> ensure Electron runtime payload (check:third-party-notices requires it)"
            node node_modules/electron/install.js
            echo "==> pre-fetch builtin plugin seeds (vitest globalSetup needs them)"
            node scripts/fetch-builtins.mjs
            echo "==> pre-fetch aria2 is SKIPPED (CI does not need engine binary)"

  - Static-Checks:
      - script:
          - |
            set -euo pipefail
            cd "$CI_PROJECT_DIR"
            echo "==> Biome toolchain fingerprint"
            pnpm exec biome --version
            pnpm ls @biomejs/biome
          - |
            set -euo pipefail
            cd "$CI_PROJECT_DIR"
            echo "==> check:i18n"
            pnpm run check:i18n
            echo "==> check:schema-parity"
            pnpm run check:schema-parity
            echo "==> check:file-names"
            pnpm run check:file-names
            echo "==> check:boundaries"
            pnpm run check:boundaries
          - |
            set -euo pipefail
            cd "$CI_PROJECT_DIR"
            echo "==> check:third-party-notices"
            pnpm run check:third-party-notices
          - |
            set -euo pipefail
            cd "$CI_PROJECT_DIR"
            echo "==> biome lint"
            pnpm run lint

  - Vitest-Suites:
      - script:
          - |
            set -euo pipefail
            cd "$CI_PROJECT_DIR"
            echo "==> Locale runtime contracts"
            pnpm exec vitest run \
              src/shared/constants/locales.test.ts \
              src/shared/i18n-resources.test.ts \
              src/shared/schemas/locale.test.ts \
              src/shared/protocol/forwardable-events.test.ts \
              src/core/i18n/locale-coordinator.test.ts \
              src/core/settings/settings-manager.test.ts \
              src/core/plugin/plugin-registry.test.ts \
              src/core/plugin/capabilities/i18n.test.ts \
              src/core/plugin/host/plugin-host.test.ts \
              src/core/plugin/host/quick-js-worker.locale.test.ts \
              src/main/ipc/events.test.ts \
              src/main/ipc/disclaimer.test.ts \
              src/main/ipc/queries.test.ts \
              src/server/ipc/queries.test.ts \
              src/shared/schemas/app-settings.test.ts \
              src/main/plugin/capability-host.test.ts \
              src/main/plugin/host-language.test.ts \
              src/main/window/window-manager.test.ts \
              src/server/plugin/capability-host.test.ts \
              src/preload/preload.test.ts \
              src/renderer/lib/bootstrap-locale.test.ts \
              src/renderer/lib/i18n.test.ts \
              src/renderer/components/ui/primitives-i18n.test.tsx \
              src/renderer/components/language-sync.test.tsx \
              src/renderer/components/locale-direction-provider.test.tsx \
              src/renderer/components/onboarding/onboarding-language-select.test.tsx \
              src/renderer/routes/plugins/hooks/use-plugin-detail.test.tsx \
              src/renderer/routes/plugins/hooks/use-plugins.test.tsx \
              src/renderer/routes/settings/cards/appearance-dialog.test.tsx \
              tests/scripts/check-i18n.test.ts
          - |
            set -euo pipefail
            cd "$CI_PROJECT_DIR"
            echo "==> Marketplace registry contracts"
            pnpm exec vitest run \
              src/shared/schemas/registry.test.ts \
              src/core/plugin/registry/registry-client.test.ts \
              src/renderer/routes/plugins/lib/registry-text.test.ts \
              src/renderer/routes/plugins/plugins-page.test.tsx \
              src/renderer/routes/plugins/components/registry-plugin-card.test.tsx \
              src/renderer/routes/plugins/components/registry-detail-panel.test.tsx \
              src/core/plugin/registry/registry-fetcher.test.ts \
              src/core/plugin/registry/update-scan.test.ts \
              src/core/plugin/install/e2e-install.test.ts \
              src/core/plugin/install/registry-expectation.test.ts \
              src/core/plugin/update/builtin-updater.test.ts \
              src/core/plugin/update/signature.test.ts
          - |
            set -euo pipefail
            cd "$CI_PROJECT_DIR"
            echo "==> Undici proxy compatibility (Node + Electron)"
            export MOTRIX_REQUIRE_ELECTRON_PROXY_TEST=1
            pnpm exec vitest run \
              src/core/engine/aria2/aria2-adapter.test.ts \
              src/core/engine/aria2/aria2-config-builder.test.ts \
              src/core/engine/aria2/aria2-process-manager.test.ts \
              src/core/engine/aria2/aria2-trust-store.test.ts \
              src/core/engine/engine-supervisor.test.ts \
              src/core/proxy/applied-download-proxy-policy.test.ts \
              src/core/proxy/applier.test.ts \
              src/core/proxy/aria2-proxy-routing.test.ts \
              src/core/proxy/serializers.test.ts \
              src/core/session/session-manager.test.ts \
              src/core/task/actions/re-add-task.test.ts \
              src/core/task/create-task-handler.test.ts \
              src/core/task/direct-resource-validator.test.ts \
              src/core/task/direct-resource-validator.proxy-contract.test.ts \
              src/core/task/direct-resource-validator.proxy.test.ts \
              src/core/tracker/tracker-prober.test.ts \
              src/core/tracker/tracker-syncer.test.ts \
              src/main/ipc/commands.test.ts \
              src/server/ipc/commands.test.ts
          - |
            set -euo pipefail
            cd "$CI_PROJECT_DIR"
            echo "==> Undici response and dispatcher lifecycle"
            pnpm exec vitest run \
              src/core/geoip/geo-ip-downloader.test.ts \
              src/core/media/manifest-fetcher.test.ts \
              src/core/plugin/capabilities/http.proxy-lifecycle.test.ts \
              src/core/plugin/install/github-fetcher.test.ts \
              src/core/plugin/install/url-fetcher.test.ts \
              src/core/plugin/registry/registry-client.test.ts \
              src/server/plugin/install-service.test.ts
          - |
            set -euo pipefail
            cd "$CI_PROJECT_DIR"
            echo "==> Native host JavaScript tooling tests"
            node --test packages/native-host/build.test.mjs packages/native-host/package-flatpak-companion.test.mjs
          - |
            set -euo pipefail
            cd "$CI_PROJECT_DIR"
            echo "==> Release and packaging contracts"
            pnpm exec vitest run \
              src/main/bridge/native-messaging-installer.test.ts \
              src/main/bridge/bootstrap-lifecycle.test.ts \
              src/main/bridge/native-host-path.test.ts \
              src/main/bridge/native-messaging-extensions.test.ts \
              src/main/bridge/snap-environment.test.ts \
              tests/scripts/assemble-release-artifacts.test.ts \
              tests/scripts/appimage-artifact.test.ts \
              tests/scripts/before-pack-verify.test.ts \
              tests/scripts/compose-server.test.ts \
              tests/scripts/container-platform-metadata.test.ts \
              tests/scripts/container-publication-state.test.ts \
              tests/scripts/container-release-metadata.test.ts \
              tests/scripts/docker-server-docs.test.ts \
              tests/scripts/electron-package-contract.test.ts \
              tests/scripts/flatpak-native-host.test.ts \
              tests/scripts/finalize-appimage-artifact.test.ts \
              tests/scripts/native-binary-target.test.ts \
              tests/scripts/obsidian-docs.test.ts \
              tests/scripts/release-metadata.test.ts \
              tests/scripts/release-signing-input.test.ts \
              tests/scripts/release-version-contract.test.ts \
              tests/scripts/workflow-release-matrix.test.ts

  - Typecheck-Root-Tests:
      - script:
          - |
            set -euo pipefail
            cd "$CI_PROJECT_DIR"
            echo "==> Type-check (root)"
            pnpm exec tsc --noEmit
          - |
            set +e
            cd "$CI_PROJECT_DIR"
            echo "==> Tests (root) — non-blocking per upstream note"
            pnpm test
            RC=$?
            echo "vitest exit code: $RC (known pre-existing failures tolerated)"
            exit 0

  - Server-Docker:
      - script:
          - |
            set -euo pipefail
            cd "$CI_PROJECT_DIR"
            echo "==> docker sanity check"
            docker version
            if docker buildx version >/dev/null 2>&1; then
              BUILDER="docker buildx build"
              echo "==> using docker buildx"
            else
              BUILDER="DOCKER_BUILDKIT=1 docker build"
              echo "==> docker buildx not available, falling back to DOCKER_BUILDKIT=1"
            fi
            echo "==> build linux/amd64 Server image"
            $BUILDER --platform linux/amd64 --tag motrix-server-ci:linux-x64-musl --load .
            echo "==> smoke test Server image"
            node scripts/smoke-server-image.mjs --image motrix-server-ci:linux-x64-musl

only:
  - main
  - develop
except:
  - tags